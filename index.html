<style>
:root{
  --ember:#ff5a1f; --flame:#ff8a00; --gold:#ffc23d; --coal:#120300; --ash:#fff3e6;
  --display:'Kanit','Prompt','Noto Sans Thai',system-ui,sans-serif;
  --body:'Prompt','Kanit','Noto Sans Thai',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--coal)}
body{
  min-height:100vh;min-height:100dvh;color:var(--ash);font-family:var(--body);
  background:
    radial-gradient(120% 60% at 50% 108%, #7a1c00 0%, #3a0c00 38%, transparent 70%),
    radial-gradient(80% 50% at 50% -10%, #2a0a02 0%, transparent 70%),
    var(--coal);
  background-attachment:fixed;
  overflow-x:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 44px) 20px calc(env(safe-area-inset-bottom,0px) + 28px);
}
/* ember glow rising from the bottom — transform only */
.heat{position:fixed;left:50%;bottom:-30vh;width:140vw;height:70vh;margin-left:-70vw;pointer-events:none;z-index:0;
  background:radial-gradient(50% 50% at 50% 60%, rgba(255,110,20,.38), rgba(255,60,0,.12) 55%, transparent 75%);
  animation:heat 5s ease-in-out infinite alternate;will-change:transform,opacity}
@keyframes heat{from{transform:scale(1) translateY(0);opacity:.75}to{transform:scale(1.08) translateY(-3vh);opacity:1}}
#sparks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}

main{position:relative;z-index:2;max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center}

/* ---------- profile frame ---------- */
.avatar{position:relative;width:176px;height:176px;animation:float 6s ease-in-out infinite;will-change:transform}
.avatar::before{ /* breathing fire aura */
  content:"";position:absolute;inset:-26px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,120,20,.55),rgba(255,70,0,.18) 65%,transparent);
  animation:aura 2.4s ease-in-out infinite alternate;will-change:transform,opacity}
.ring{position:absolute;inset:-7px;border-radius:50%;
  background:conic-gradient(from 0deg,#ff2d00,#ff8a00,#ffd85a,#ff8a00,#ff2d00,#7a1000,#ff2d00);
  animation:spin 5s linear infinite;will-change:transform}
.ring.two{inset:-13px;opacity:.55;filter:blur(7px);animation-duration:3.2s;animation-direction:reverse}
.avatar .gap{position:absolute;inset:-2px;border-radius:50%;background:var(--coal)}
.avatar img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);border-radius:50%;object-fit:cover;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes aura{from{transform:scale(.94);opacity:.7}to{transform:scale(1.06);opacity:1}}

/* ---------- name & bio ---------- */
h1{margin-top:30px;font-family:var(--display);font-style:italic;font-weight:800;font-size:clamp(2.6rem,11vw,3.4rem);line-height:1;letter-spacing:.01em;
  background:linear-gradient(180deg,#fff7d6 0%,#ffcf4a 38%,#ff7a12 72%,#ff3d00 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 14px rgba(255,90,20,.55));padding:0 .1em .08em}
.bio{margin-top:14px;text-align:center;font-size:.98rem;line-height:1.85;color:#ffe3c8}
.bio span{display:block}
.bio span:first-child{font-family:var(--display);font-weight:500;font-size:1.08rem;color:#fff}

/* ---------- round tiktok ---------- */
.round{margin-top:22px;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;position:relative;text-decoration:none}
.round img{width:28px;height:auto;position:relative;z-index:1;transition:transform .35s cubic-bezier(.2,.8,.2,1)}

/* ---------- glass ---------- */
.glass{
  position:relative;overflow:hidden;isolation:isolate;
  background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.04) 55%,rgba(255,140,40,.08));
  -webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,120,30,.18),0 8px 24px rgba(0,0,0,.35),0 0 0 1px rgba(255,170,90,.22);
  transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,background .3s;
}
.glass::after{ /* light sweep */
  content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;z-index:0;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-20deg) translateX(0);transition:transform .8s ease}
.glass:hover,.glass:focus-visible{
  transform:translateY(-3px);
  background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.06) 55%,rgba(255,140,40,.16));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 12px 30px rgba(255,80,0,.28),0 0 0 1px rgba(255,200,120,.55)}
.glass:hover::after,.glass:focus-visible::after{transform:skewX(-20deg) translateX(520%)}
.glass:active{transform:translateY(0) scale(.97)}
.round:hover img{transform:scale(1.12) rotate(-6deg)}
a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---------- link list ---------- */
.links{margin-top:34px;width:100%;display:flex;flex-direction:column;gap:14px;list-style:none}
.btn{display:flex;align-items:center;gap:14px;padding:12px 18px 12px 12px;border-radius:20px;text-decoration:none;color:#fff;min-height:68px}
.ico{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;position:relative;z-index:1}
.ico img{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
.ico.wide{width:62px}
.ico.x img,.ico.dc img{width:26px}
.ico.ig img{width:38px}
.txt{position:relative;z-index:1;display:flex;flex-direction:column;line-height:1.25;min-width:0}
.txt b{font-family:var(--display);font-weight:500;font-size:1.12rem;letter-spacing:.01em}
.txt small{font-size:.8rem;color:#ffd9b8;opacity:.9}
.chev{margin-left:auto;position:relative;z-index:1;width:20px;height:20px;opacity:.7;transition:transform .3s}
.btn:hover .chev{transform:translateX(4px);opacity:1}

footer{position:relative;z-index:2;margin:38px auto 0;text-align:center;font-size:.8rem;color:#e9b48a;opacity:.85}
footer b{font-family:var(--display);font-weight:500;color:#ffcf8a}

@media (min-width:700px){body{padding-top:70px}.avatar{width:196px;height:196px}}
@media (prefers-reduced-motion:reduce){
  .avatar,.ring,.avatar::before,.heat{animation:none}
  .glass,.glass::after,.round img{transition:none}
}
</style>

<script>
(function(){
  var c=document.getElementById('sparks'),ctx=c.getContext('2d');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce)return;
  var W,H,dpr,P=[],N,raf=0,last=0;
  // pre-rendered glow sprites => no shadowBlur, very cheap
  function sprite(r,g,b){var s=document.createElement('canvas');s.width=s.height=32;var x=s.getContext('2d');
    var gr=x.createRadialGradient(16,16,0,16,16,16);
    gr.addColorStop(0,'rgba(255,250,220,1)');gr.addColorStop(.25,'rgba('+r+','+g+','+b+',.9)');gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');
    x.fillStyle=gr;x.fillRect(0,0,32,32);return s}
  var S=[sprite(255,200,60),sprite(255,130,20),sprite(255,70,10)];
  function size(){dpr=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;
    c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    N=W<600?22:38;while(P.length<N)P.push(mk(true));P.length=N}
  function mk(init){return{x:Math.random()*W,y:init?Math.random()*H:H+10,
    r:Math.random()*5+2.5,vy:Math.random()*28+18,vx:(Math.random()-.5)*14,
    ph:Math.random()*6.28,sw:Math.random()*14+6,life:Math.random()*.5+.5,t:S[(Math.random()*3)|0]}}
  function frame(t){raf=requestAnimationFrame(frame);
    var dt=Math.min((t-last)/1000,.05);last=t;
    ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
    for(var i=0;i<P.length;i++){var p=P[i];
      p.y-=p.vy*dt;p.ph+=dt*1.6;p.x+=(p.vx+Math.sin(p.ph)*p.sw)*dt;
      var k=p.y/H; if(p.y<-12||p.x<-20||p.x>W+20){P[i]=mk(false);continue}
      ctx.globalAlpha=Math.max(0,Math.min(1,k*1.25))*p.life*(.7+.3*Math.sin(p.ph*3));
      var d=p.r*(.55+k*.6)*2;ctx.drawImage(p.t,p.x-d/2,p.y-d/2,d,d)}
    ctx.globalAlpha=1}
  function start(){if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}}
  function stop(){cancelAnimationFrame(raf);raf=0}
  addEventListener('resize',size);
  document.addEventListener('visibilitychange',function(){document.hidden?stop():start()});
  size();start();
})();
</script>
