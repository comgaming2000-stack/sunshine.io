<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>SunShine</title>
<style>
  :root{
    --void:      #0a0705;
    --void-2:    #150b08;
    --ember-1:   #ff5a1f;
    --ember-2:   #ffb238;
    --ember-3:   #ff2d2d;
    --blood:     #7a1620;
    --ash:       #f3e8de;
    --ash-dim:   #b9a99a;
    --glass:     rgba(255,255,255,0.045);
    --glass-brd: rgba(255,178,56,0.22);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    background: var(--void);
    color: var(--ash);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    overflow-x:hidden;
  }

  /* ---------- ambient background ---------- */
  .bg-glow{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 45% at 50% 100%, rgba(255,90,31,0.28), transparent 70%),
      radial-gradient(ellipse 55% 30% at 15% 15%, rgba(122,22,32,0.20), transparent 70%),
      radial-gradient(ellipse 55% 30% at 85% 10%, rgba(255,178,56,0.10), transparent 70%),
      linear-gradient(180deg, var(--void-2) 0%, var(--void) 55%, #050302 100%);
  }

  .embers{ position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden; }
  .ember{
    position:absolute; bottom:-5%;
    width: var(--s,4px); height: var(--s,4px);
    border-radius:50%;
    background: radial-gradient(circle, var(--ember-2), var(--ember-1) 60%, transparent 75%);
    opacity:0;
    animation: rise var(--d,9s) linear infinite;
    animation-delay: var(--dl,0s);
    box-shadow: 0 0 6px 1px rgba(255,140,40,0.6);
  }
  @keyframes rise{
    0%   { transform: translateY(0) translateX(0); opacity:0; }
    8%   { opacity:.9; }
    50%  { transform: translateY(-55vh) translateX(var(--x,10px)); opacity:.7; }
    92%  { opacity:0; }
    100% { transform: translateY(-105vh) translateX(calc(var(--x,10px) * 2)); opacity:0; }
  }

  /* ---------- layout ---------- */
  .page{
    position:relative; z-index:2;
    min-height:100svh;
    display:flex; flex-direction:column; align-items:center;
    padding: 48px 20px 32px;
  }

  .card{
    width:100%; max-width:430px;
    display:flex; flex-direction:column; align-items:center;
  }

  /* ---------- avatar ---------- */
  .avatar-wrap{
    position:relative;
    width:132px; height:132px;
    margin-bottom:18px;
  }
  .avatar-ring{
    position:absolute; inset:-9px;
    border-radius:50%;
    background: conic-gradient(from 0deg, var(--ember-1), var(--ember-2), var(--ember-3), var(--ember-1));
    animation: spin 7s linear infinite;
    filter: blur(0.3px);
  }
  .avatar-ring::after{
    content:""; position:absolute; inset:3px;
    border-radius:50%; background: var(--void);
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .avatar{
    position:relative; z-index:2;
    width:132px; height:132px; border-radius:50%;
    object-fit:cover;
    box-shadow: 0 0 0 4px rgba(10,7,5,0.9), 0 8px 30px rgba(255,90,31,0.35);
    display:block;
  }

  .name{
    margin: 4px 0 2px;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.5px;
    background: linear-gradient(120deg, var(--ember-2), var(--ember-1) 55%, var(--ember-3));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow: 0 0 26px rgba(255,90,31,0.35);
    font-style: italic;
  }

  .subline{
    font-size:11px; letter-spacing:3px; text-transform:uppercase;
    color: var(--ash-dim); margin-bottom:16px; font-family: "Courier New", monospace;
  }

  .flame-rule{
    width:64px; height:2px; margin-bottom:18px;
    background: linear-gradient(90deg, transparent, var(--ember-1), var(--ember-2), var(--ember-1), transparent);
    border-radius:2px;
    box-shadow: 0 0 8px rgba(255,140,40,0.6);
  }

  /* ---------- tiktok round button (below profile) ---------- */
  .tiktok-btn{
    position:relative;
    width:56px; height:56px;
    border-radius:50%;
    margin-bottom:26px;
    display:flex; align-items:center; justify-content:center;
    background: var(--glass);
    border: 1px solid var(--glass-brd);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    cursor:pointer;
    text-decoration:none;
    overflow:hidden;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .tiktok-btn img{ width:26px; height:26px; position:relative; z-index:2; }
  .tiktok-btn:hover{
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 6px 22px rgba(255,90,31,0.35);
    border-color: rgba(255,178,56,0.55);
  }
  .tiktok-btn .tag{
    position:absolute; bottom:-20px; left:50%; transform:translateX(-50%);
    font-size:9px; letter-spacing:2px; color: var(--ash-dim);
    white-space:nowrap; font-family:"Courier New", monospace;
  }

  /* ---------- link list ---------- */
  .links{
    width:100%;
    display:flex; flex-direction:column; gap:14px;
    margin-top: 6px;
  }

  .link-btn{
    position:relative;
    display:flex; align-items:center; gap:14px;
    width:100%; padding:15px 20px;
    border-radius:16px;
    background: var(--glass);
    border: 1px solid var(--glass-brd);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    text-decoration:none; color: var(--ash);
    overflow:hidden;
    isolation:isolate;
    cursor:pointer;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .link-btn:hover{
    transform: translateY(-2px);
    border-color: rgba(255,178,56,0.55);
    box-shadow: 0 8px 26px rgba(255,90,31,0.22);
  }
  .link-btn:active{ transform: translateY(0) scale(0.985); }

  .icon-box{
    flex:0 0 auto; width:38px; height:38px; border-radius:11px;
    background: rgba(0,0,0,0.25);
    display:flex; align-items:center; justify-content:center;
    position:relative; z-index:2;
    overflow:hidden;
  }
  .icon-box img{ width:24px; height:24px; object-fit:contain; }
  .icon-box.square img{ width:100%; height:100%; object-fit:cover; }

  .label-box{ position:relative; z-index:2; display:flex; flex-direction:column; gap:2px; }
  .label-title{ font-size:15.5px; font-weight:700; letter-spacing:0.3px; }
  .label-sub{ font-size:11px; color: var(--ash-dim); font-family:"Courier New", monospace; letter-spacing:0.5px; }

  .arrow{
    margin-left:auto; position:relative; z-index:2;
    color: var(--ember-2); font-size:16px; opacity:.75;
  }

  /* ---------- ignite (fire click effect) ---------- */
  .flame-layer{
    position:absolute; inset:0; z-index:1; pointer-events:none;
    opacity:0;
  }
  .link-btn.ignite .flame-layer,
  .tiktok-btn.ignite .flame-layer{
    opacity:1;
    animation: flame-sweep .65s ease-out;
  }
  .flame-layer{
    background:
      radial-gradient(circle at 20% 120%, rgba(255,178,56,0.9), transparent 40%),
      radial-gradient(circle at 50% 130%, rgba(255,90,31,0.95), transparent 45%),
      radial-gradient(circle at 80% 120%, rgba(255,45,45,0.85), transparent 40%);
    filter: blur(4px);
  }
  @keyframes flame-sweep{
    0%   { transform: translateY(100%) scaleY(0.4); opacity:0; }
    30%  { opacity:1; }
    100% { transform: translateY(-30%) scaleY(1.15); opacity:0; }
  }

  .spark{
    position:fixed; z-index:5; pointer-events:none;
    width:5px; height:5px; border-radius:50%;
    background: radial-gradient(circle, var(--ember-2), var(--ember-1));
    box-shadow: 0 0 8px 2px rgba(255,140,40,0.7);
    animation: spark-fly .7s ease-out forwards;
  }
  @keyframes spark-fly{
    to{ transform: translate(var(--dx), var(--dy)) scale(0); opacity:0; }
  }

  footer{
    margin-top:34px; text-align:center;
    font-size:11px; letter-spacing:2px; color: rgba(185,169,154,0.55);
    font-family:"Courier New", monospace;
  }

  @media (max-width:380px){
    .avatar-wrap, .avatar{ width:112px; height:112px; }
    .name{ font-size:26px; }
  }

  @media (prefers-reduced-motion: reduce){
    .ember, .avatar-ring{ animation: none !important; }
  }
</style>
</head>

<script>
  // ambient ember particles
  (function(){
    const wrap = document.getElementById('embers');
    const n = 22;
    for(let i=0;i<n;i++){
      const e = document.createElement('div');
      e.className = 'ember';
      const size = (Math.random()*3+2).toFixed(1);
      const left = (Math.random()*100).toFixed(1);
      const dur = (Math.random()*6+7).toFixed(1);
      const delay = (Math.random()*9).toFixed(1);
      const drift = (Math.random()*60-30).toFixed(0);
      e.style.setProperty('--s', size+'px');
      e.style.left = left+'%';
      e.style.setProperty('--d', dur+'s');
      e.style.setProperty('--dl', delay+'s');
      e.style.setProperty('--x', drift+'px');
      wrap.appendChild(e);
    }
  })();

  // ignite + spark effect on press
  function spawnSparks(x,y,count){
    for(let i=0;i<count;i++){
      const s = document.createElement('div');
      s.className = 'spark';
      const angle = Math.random()*Math.PI*2;
      const dist = 30 + Math.random()*50;
      s.style.left = x+'px';
      s.style.top = y+'px';
      s.style.setProperty('--dx', (Math.cos(angle)*dist).toFixed(0)+'px');
      s.style.setProperty('--dy', (Math.sin(angle)*dist - 30).toFixed(0)+'px');
      document.body.appendChild(s);
      setTimeout(()=>s.remove(), 750);
    }
  }

  document.querySelectorAll('.link-btn, .tiktok-btn').forEach(btn=>{
    btn.addEventListener('pointerdown', (ev)=>{
      btn.classList.remove('ignite');
      void btn.offsetWidth;
      btn.classList.add('ignite');
      spawnSparks(ev.clientX, ev.clientY, 9);
      setTimeout(()=>btn.classList.remove('ignite'), 650);
    });
  });
</script>
